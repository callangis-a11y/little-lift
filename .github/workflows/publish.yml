name: Check and publish

# Every change is checked. Changes merged into main go live automatically.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check content and app safety rules
        run: node scripts/validate.mjs
      - name: Build the site
        run: node scripts/build.mjs
      - name: Install test browser
        run: npm install --no-save playwright@1.56.1 && npx playwright install --with-deps chromium
      - name: Open the site and test the essentials
        run: node scripts/smoke.mjs
      - name: Package site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  publish:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
